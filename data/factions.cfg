# 第 5 天正式分队配置：防御、进攻和路线/经济三种方向。
[faction:training_team]
name=坚壁分队
initial_guard=100
max_deployed=4
price_multiplier=1.0

[faction:assault_team]
name=突击分队
initial_guard=100
max_deployed=5
price_multiplier=1.0

[faction:route_team]
name=行军分队
initial_guard=95
max_deployed=5
price_multiplier=0.9

[faction_modifier:training_attack_bonus]
faction_id=training_team
unit_id=training_guard
attribute=attack_power
operation=multiply
value=1.10

[faction_modifier:training_defense_bonus]
faction_id=training_team
unit_id=training_guard
attribute=physical_defense
operation=add
value=4

[faction_modifier:assault_duelist_bonus]
faction_id=assault_team
unit_id=duelist
attribute=attack_power
operation=multiply
value=1.12

[faction_modifier:assault_ranger_bonus]
faction_id=assault_team
unit_id=ranger
attribute=attack_speed
operation=add
value=20

[faction_modifier:route_speed_bonus]
faction_id=route_team
unit_id=ranger
attribute=move_speed
operation=multiply
value=1.12

[faction_modifier:route_medic_price]
faction_id=route_team
unit_id=medic
attribute=price
operation=add
value=-1
